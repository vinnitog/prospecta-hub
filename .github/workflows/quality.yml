name: Quality
on:
  workflow_dispatch:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - run: npm test
      - run: npm run check
      - run: node scripts/check-public-repo.js
      - run: node scripts/build-pages.js
